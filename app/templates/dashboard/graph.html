{% extends 'base.html' %}
{% block title %}Dependency Graph — {{ scan.project_name }}{% endblock %}

{% block content %}
<!-- Load D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<div class="container-fluid py-3 h-100 d-flex flex-column" style="min-height: calc(100vh - 70px);">
    <div class="d-flex justify-content-between align-items-center mb-3 px-3">
        <div>
            <h4 class="mb-0 text-white fw-bold">Dependency Graph: {{ scan.project_name }}</h4>
            <p class="text-muted small mb-0">Force-directed layout of your project dependencies</p>
        </div>
        <a href="/dashboard/scan/{{ scan.id }}" class="btn btn-outline-light glass-btn d-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            Back to Details
        </a>
    </div>

    <!-- Graph Container -->
    <div class="flex-grow-1 position-relative graph-container glass-card rounded-4 overflow-hidden shadow-lg mx-3 mb-3" style="min-height: 600px; background: #050811;">
        
        <!-- Controls overlay -->
        <div class="position-absolute top-0 end-0 p-3 z-1">
            <div class="btn-group-vertical glass-card rounded-3 shadow">
                <button id="zoom-in" class="btn btn-sm btn-outline-secondary border-0 text-white p-2" title="Zoom In">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-in" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/>
                        <path d="M10.344 11.742c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1 6.538 6.538 0 0 1-1.398 1.4z"/>
                        <path fill-rule="evenodd" d="M6.5 3a.5.5 0 0 1 .5.5V6h2.5a.5.5 0 0 1 0 1H7v2.5a.5.5 0 0 1-1 0V7H3.5a.5.5 0 0 1 0-1H6V3.5a.5.5 0 0 1 .5-.5z"/>
                    </svg>
                </button>
                <button id="zoom-reset" class="btn btn-sm btn-outline-secondary border-0 text-white p-2 border-top border-secondary border-opacity-25" title="Reset Zoom">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16">
                        <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"/>
                    </svg>
                </button>
                <button id="zoom-out" class="btn btn-sm btn-outline-secondary border-0 text-white p-2 border-top border-secondary border-opacity-25" title="Zoom Out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-out" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/>
                        <path d="M10.344 11.742c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1 6.538 6.538 0 0 1-1.398 1.4z"/>
                        <path fill-rule="evenodd" d="M3 6.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Legend -->
        <div class="position-absolute bottom-0 start-0 p-4 z-1 pointer-events-none">
            <div id="graph-legend" class="glass-card p-3 rounded-3 shadow text-white pointer-events-auto" style="max-width: 200px;">
                <h6 class="border-bottom border-secondary border-opacity-25 pb-2 mb-2 fs-7 fw-semibold">Ecosystems</h6>
                <div id="legend-items" class="d-flex flex-column gap-2 small"></div>
                <h6 class="border-bottom border-secondary border-opacity-25 pb-2 mb-2 mt-3 fs-7 fw-semibold">Severity</h6>
                <div class="d-flex flex-column gap-2 small">
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle" style="width:12px; height:12px; background:var(--severity-critical); box-shadow: 0 0 10px var(--severity-critical);"></div> Critical
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle" style="width:12px; height:12px; background:var(--severity-high); box-shadow: 0 0 8px var(--severity-high);"></div> High
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle" style="width:12px; height:12px; background:var(--severity-medium);"></div> Medium
                    </div>
                </div>
            </div>
        </div>

        <svg id="d3-graph" width="100%" height="100%"></svg>
        
        <!-- Tooltip -->
        <div id="d3-tooltip" class="position-absolute opacity-0 glass-card p-3 rounded-3 shadow text-white pointer-events-none transition-opacity" style="z-index: 1000; transition: opacity 0.2s;"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var graphData = {{ graph_json|safe }};
    
    const svg = d3.select("#d3-graph");
    const container = document.querySelector('.graph-container');
    const width = container.clientWidth;
    const height = container.clientHeight || 600;
    
    // Set viewbox
    svg.attr("viewBox", [0, 0, width, height]);
    
    // Create color scale for groups
    const color = d3.scaleOrdinal(d3.schemeCategory10);
    
    // Create tooltip
    const tooltip = d3.select("#d3-tooltip");
    
    // Define force simulation
    const simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(d => {
            return d.source.group === "project" || d.target.group === "project" ? 150 : 80;
        }))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide().radius(d => d.group === "project" ? 40 : 25));

    // Create wrapper for zoom
    const g = svg.append("g");
    
    // Set up zoom
    const zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on("zoom", (event) => {
            g.attr("transform", event.transform);
        });
        
    svg.call(zoom);

    // Zoom controls
    d3.select("#zoom-in").on("click", () => {
        svg.transition().duration(300).call(zoom.scaleBy, 1.3);
    });
    
    d3.select("#zoom-out").on("click", () => {
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
    });
    
    d3.select("#zoom-reset").on("click", () => {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    });

    // Draw links
    const link = g.append("g")
        .attr("stroke", "rgba(255,255,255,0.2)")
        .attr("stroke-opacity", 0.6)
        .selectAll("line")
        .data(graphData.links)
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.value || 1));

    // Draw nodes
    const node = g.append("g")
        .selectAll("circle")
        .data(graphData.nodes)
        .join("circle")
        .attr("r", d => d.group === "project" ? 24 : (d.size || 10))
        .attr("fill", d => {
            if (d.group === "project") return "url(#grad1)";
            return color(d.group);
        })
        .attr("stroke", d => {
            if (d.group === "project") return "#fbbf24";
            if (d.vulnerability_count > 0) {
                if (d.max_severity === "critical") return "var(--severity-critical)";
                if (d.max_severity === "high") return "var(--severity-high)";
                if (d.max_severity === "medium") return "var(--severity-medium)";
                return "var(--severity-low)";
            }
            return "#fff";
        })
        .attr("stroke-width", d => {
            if (d.group === "project") return 3;
            if (d.vulnerability_count > 0) return 3;
            return 1.5;
        })
        .call(drag(simulation));

    // Add glowing filter for project node
    const defs = svg.append("defs");
    
    const gradient = defs.append("radialGradient")
        .attr("id", "grad1")
        .attr("cx", "50%")
        .attr("cy", "50%")
        .attr("r", "50%");
        
    gradient.append("stop")
        .attr("offset", "0%")
        .style("stop-color", "#fbbf24");
        
    gradient.append("stop")
        .attr("offset", "100%")
        .style("stop-color", "#d97706");
        
    // Add pulsing animation for critical nodes
    node.filter(d => d.vulnerability_count > 0 && d.max_severity === "critical")
        .attr("class", "pulsing-node");

    // Draw labels
    const label = g.append("g")
        .selectAll("text")
        .data(graphData.nodes)
        .join("text")
        .text(d => d.name)
        .attr("font-size", d => d.group === "project" ? "14px" : "10px")
        .attr("font-weight", d => d.group === "project" ? "bold" : "normal")
        .attr("fill", "#fff")
        .attr("dx", d => d.group === "project" ? 30 : 15)
        .attr("dy", 4);

    // Node interactions
    node
        .on("mouseover", (event, d) => {
            // Highlight connections
            link.style("stroke-opacity", l => (l.source === d || l.target === d) ? 1 : 0.1);
            link.style("stroke", l => (l.source === d || l.target === d) ? "#fff" : "rgba(255,255,255,0.2)");
            node.style("opacity", n => (n === d || isConnected(d, n)) ? 1 : 0.3);
            label.style("opacity", n => (n === d || isConnected(d, n)) ? 1 : 0.3);
            
            // Show tooltip
            let tooltipHtml = `
                <div class="fw-bold fs-6 mb-1">${d.name}</div>
            `;
            
            if (d.group !== "project") {
                tooltipHtml += `
                    <div class="font-monospace text-muted small mb-2">${d.version || 'Unknown version'}</div>
                    <div class="d-flex align-items-center gap-2 mb-1 small">
                        <span class="badge bg-secondary bg-opacity-25 border border-secondary border-opacity-25">${d.group}</span>
                    </div>
                `;
                
                if (d.vulnerability_count > 0) {
                    let sevClass = d.max_severity === 'critical' ? 'danger' : (d.max_severity === 'low' ? 'primary' : 'warning');
                    let bgStyle = '';
                    let textClass = 'text-white';
                    
                    if (d.max_severity === 'high') bgStyle = 'background-color: var(--severity-high) !important;';
                    if (d.max_severity === 'medium') {
                        bgStyle = 'background-color: var(--severity-medium) !important;';
                        textClass = 'text-dark';
                    }
                        
                    tooltipHtml += `
                        <div class="mt-2 pt-2 border-top border-secondary border-opacity-25">
                            <span class="badge rounded-pill bg-${sevClass} ${textClass}" style="${bgStyle}">
                                ${d.vulnerability_count} Vulnerabilit${d.vulnerability_count > 1 ? 'ies' : 'y'}
                            </span>
                        </div>
                    `;
                } else {
                    tooltipHtml += `
                        <div class="mt-2 pt-2 border-top border-secondary border-opacity-25 text-success small">
                            ✓ No known vulnerabilities
                        </div>
                    `;
                }
            } else {
                tooltipHtml += `<div class="small text-muted">Root Project Node</div>`;
            }

            tooltip
                .html(tooltipHtml)
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 28) + "px")
                .style("opacity", 1);
        })
        .on("mousemove", (event) => {
            tooltip
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", () => {
            link.style("stroke-opacity", 0.6).style("stroke", "rgba(255,255,255,0.2)");
            node.style("opacity", 1);
            label.style("opacity", 1);
            tooltip.style("opacity", 0);
        });

    // Tick function
    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);
            
        label
            .attr("x", d => d.x)
            .attr("y", d => d.y);
    });

    // Helper functions
    const linkedByIndex = {};
    graphData.links.forEach(d => {
        linkedByIndex[`${d.source.id},${d.target.id}`] = 1;
    });

    function isConnected(a, b) {
        return linkedByIndex[`${a.id},${b.id}`] || linkedByIndex[`${b.id},${a.id}`] || a.id === b.id;
    }

    function drag(simulation) {
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        return d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);
    }
    
    // Build legend
    const ecosystems = [...new Set(graphData.nodes.map(n => n.group).filter(g => g !== "project"))];
    const legendContainer = d3.select("#legend-items");
    
    ecosystems.forEach(eco => {
        const item = legendContainer.append("div").attr("class", "d-flex align-items-center gap-2");
        item.append("div")
            .attr("class", "rounded-circle")
            .style("width", "12px")
            .style("height", "12px")
            .style("background-color", color(eco));
        item.append("span").text(eco);
    });
});
</script>

<style>
.pulsing-node {
    animation: pulse-red 2s infinite;
}

@keyframes pulse-red {
    0% { filter: drop-shadow(0 0 4px var(--severity-critical)); }
    50% { filter: drop-shadow(0 0 12px var(--severity-critical)); }
    100% { filter: drop-shadow(0 0 4px var(--severity-critical)); }
}

.pointer-events-none { pointer-events: none; }
.pointer-events-auto { pointer-events: auto; }
</style>
{% endblock %}
